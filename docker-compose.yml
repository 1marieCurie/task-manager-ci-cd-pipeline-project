
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - taskpilot_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env

volumes:
  taskpilot_node_modules:
    external: true
